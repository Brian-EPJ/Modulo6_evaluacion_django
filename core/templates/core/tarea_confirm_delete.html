{% extends 'base.html' %}
{% block titulo %}Eliminar tarea{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-danger">
            <div class="card-body p-4">
                <h1 class="h4 mb-3 text-danger">
                    <i class="bi bi-exclamation-triangle"></i> Eliminar tarea
                </h1>
                <p>
                    ¿Confirma que quieres eliminar la tarea
                    <strong>"{{ object.titulo }}"</strong>? Esta acción no se puede deshacer.
                </p>

                <!-- data-confirmar-eliminacion activa la confirmación extra
                     definida en core/static/core/js/scripts.js -->
                <form method="post"
                      data-confirmar-eliminacion="¿Seguro que quieres eliminar esta tarea? No se puede deshacer.">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">
                            <i class="bi bi-trash"></i> Sí, eliminar
                        </button>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
